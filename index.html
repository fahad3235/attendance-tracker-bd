<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Attendance Tracker BD</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header class="topbar">
  <div class="wrap topbarIn">
    <div>
      <h1 id="appTitle">Attendance Tracker BD</h1>
      <p id="appSub" class="sub"></p>
    </div>
    <button id="langBtn" class="btn ghost" aria-label="Language">বাং</button>
  </div>
</header>

<main class="wrap">
  <section class="card">
    <h2 id="addTitle">Add a subject</h2>
    <div class="addRow">
      <input id="nameInput" type="text" maxlength="60">
      <label class="reqWrap"><span id="reqLabel">Required %</span>
        <input id="reqInput" type="number" min="1" max="100" value="75">
      </label>
      <button id="addBtn" class="btn primary">Add</button>
    </div>
    <p id="errAdd" class="err" role="alert"></p>
  </section>

  <section class="card">
    <h2 id="overallTitle">Overall attendance</h2>
    <div class="overallRow">
      <div id="overallPct" class="bigPct">—</div>
      <p id="overallDetail" class="muted"></p>
    </div>
  </section>

  <div id="subjects"></div>

  <section class="card">
    <h2 id="dataTitle">Data</h2>
    <div class="btnRow">
      <button id="sampleBtn" class="btn">Load sample data</button>
      <button id="exportBtn" class="btn">Export JSON</button>
      <button id="importBtn" class="btn">Import JSON</button>
      <button id="clearBtn" class="btn danger">Clear all</button>
    </div>
    <input id="fileInput" type="file" accept="application/json" hidden>
  </section>

  <footer class="foot muted">100% offline — your data never leaves this browser.</footer>
</main>

<script src="js/i18n.js"></script>
<script src="js/app.js"></script>
</body>
</html>
